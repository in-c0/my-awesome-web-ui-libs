name: Independent Paper UI CI

on:
  push:
    branches: [export/paper-ui, main]
  pull_request:

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build publishable React package and studio
        run: bun run build
      - name: Unit tests
        run: bun run test
      - name: Npm package dry run
        run: cd packages/paper-ui && npm pack --dry-run
      - name: Check whether emitted declarations and CSS exist
        run: |
          test -f packages/paper-ui/dist/index.d.ts
          test -f packages/paper-ui/dist/index.js
          test -f packages/paper-ui/dist/paper.css

  browser:
    needs: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun --filter @in-c0/paper-ui build
      - run: bunx playwright install --with-deps chromium
      - name: Browser UI and mobile interaction tests
        run: bun run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-ui-qa
          path: |
            apps/studio/test-results/
            apps/studio/playwright-report/
          retention-days: 7
