# Publishes every package whose version in package.json is not on npm yet.
# Releasing a library = bumping its version in a commit to main. Nothing else.
# Authentication, first that works:
#  - npm trusted publishing (OIDC): a package whose npmjs.com settings name this repository
#    and release.yml as its trusted publisher goes live at once, with no token and no 2FA.
#  - the NPM_TOKEN secret: direct-capable tokens publish at once; stage-only tokens stage the
#    version, which goes live when it is approved on npmjs.com (with 2FA).
name: Release
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      filter:
        description: "pnpm --filter for what to publish (default: every package)"
        required: false
        default: "./packages/**"
permissions: { contents: read, id-token: write }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: node scripts/unpublished.mjs --github-output
      - if: steps.plan.outputs.count != '0'
        run: pnpm build && pnpm test
      - if: steps.plan.outputs.count != '0'
        name: An npm with trusted publishing and staging
        run: npm install --global 'npm@^11.5.1'
      - if: steps.plan.outputs.count != '0'
        name: Publish new versions (live through trusted publishing, or staged for approval)
        run: node scripts/publish.mjs "${{ inputs.filter || './packages/**' }}"
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
