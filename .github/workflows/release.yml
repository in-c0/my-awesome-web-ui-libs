# Publishes every package whose version in package.json is not on npm yet.
# Releasing a library = bumping its version in a commit to main. Nothing else.
# Needs one repository secret, NPM_TOKEN. With a direct-capable token versions go live at
# once; with a stage-only token they are staged and go live when approved on npmjs.com.
name: Release
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      filter:
        description: "pnpm --filter for what to publish (default: every package)"
        required: false
        default: "./packages/**"
permissions: { contents: read, id-token: write }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { HAS_TOKEN: "${{ secrets.NPM_TOKEN != '' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: node scripts/unpublished.mjs --github-output
      - if: steps.plan.outputs.count != '0' && env.HAS_TOKEN != 'true'
        run: echo "::warning::Versions are waiting to be published, but the NPM_TOKEN secret is not set (Settings → Secrets and variables → Actions)."
      - if: steps.plan.outputs.count != '0' && env.HAS_TOKEN == 'true'
        run: pnpm build && pnpm test
      - if: steps.plan.outputs.count != '0' && env.HAS_TOKEN == 'true'
        name: A staging-capable npm
        run: npm install --global 'npm@^11'
      - if: steps.plan.outputs.count != '0' && env.HAS_TOKEN == 'true'
        name: Publish new versions (live, or staged for approval)
        run: node scripts/publish.mjs "${{ inputs.filter || './packages/**' }}"
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
