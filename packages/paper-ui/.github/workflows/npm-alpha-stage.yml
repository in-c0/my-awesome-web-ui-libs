name: Stage npm alpha (manual approval required)

# Never deploy on push or tag creation. Only an owner can explicitly start this.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'To stage the first alpha, type STAGE-0.1.0-alpha.1'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-alpha-first-stage
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'STAGE-0.1.0-alpha.1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install exactly the checked-in workspace dependencies
        run: bun install --frozen-lockfile
      - name: Validate the release manifest
        run: |
          node <<'JS'
          const p = require('./packages/paper-ui/package.json');
          if (p.name !== '@in-c0/paper-ui' || p.version !== '0.1.0-alpha.1' || p.publishConfig?.access !== 'public' || p.private === true) {
            console.error('Unexpected npm alpha manifest. Refusing to stage.');
            process.exit(1);
          }
          if (p.repository?.url !== 'git+https://github.com/in-c0/paper-ui.git') {
            console.error('Wrong canonical repository URL. Refusing to stage.');
            process.exit(1);
          }
          JS
      - name: Build the release artifact and test source
        run: |
          bun --filter @in-c0/paper-ui build
          bun --filter @in-c0/paper-ui test
          test -f packages/paper-ui/dist/index.js
          test -f packages/paper-ui/dist/index.d.ts
          test -f packages/paper-ui/dist/paper.css
          test -f packages/paper-ui/dist/paper.css.d.ts
      - name: Confirm the version is not already published
        run: |
          response="$(curl --silent --show-error --retry 2 --output "$RUNNER_TEMP/registry.json" --write-out '%{http_code}' 'https://registry.npmjs.org/%40in-c0%2Fpaper-ui')"
          if [ "$response" = "404" ]; then
            echo 'No public package record exists yet. First-release staging is appropriate.'
          elif [ "$response" = "200" ]; then
            node - "$RUNNER_TEMP/registry.json" <<'JS'
          const { readFileSync } = require('node:fs');
          const doc = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (doc.versions?.['0.1.0-alpha.1']) {
            console.error('Version 0.1.0-alpha.1 is already publicly released. Aborting.');
            process.exit(1);
          }
          JS
          else
            echo "::error::Unable to verify npm registry (HTTP $response). Aborting."
            exit 1
          fi
      - name: Inspect the exact files npm will stage
        run: |
          cd packages/paper-ui
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node - "$RUNNER_TEMP/pack.json" <<'JS'
          const {readFileSync} = require('node:fs');
          const tar = JSON.parse(readFileSync(process.argv[2], 'utf8'))[0];
          const files = new Set(tar.files.map(file => file.path));
          for (const path of ['dist/index.js','dist/index.d.ts','dist/paper.css','dist/paper.css.d.ts','LICENSE','THIRD_PARTY_NOTICES.md','README.md']) {
            if (!files.has(path)) {
              console.error('Missing in npm package: ' + path);
              process.exit(1);
            }
          }
          console.log('Release manifest and expected files validated:', tar.name, tar.version);
          JS
      - name: Rebuild independent React consumer
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/consumer/src"
          cd packages/paper-ui
          npm pack --pack-destination "$RUNNER_TEMP" --silent
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/in-c0-paper-ui-*.tgz react@19 react-dom@19 vite@8 typescript@6 @types/react@19 @types/react-dom@19
          cat > index.html <<'HTML'
          <!doctype html><html><head><meta charset="UTF-8"/></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
          HTML
          cat > src/main.tsx <<'TSX'
          import React from 'react';
          import '@in-c0/paper-ui/styles.css';
          import { createRoot } from 'react-dom/client';
          import { PaperSurface, PaperCard, PaperButton, PencilText } from '@in-c0/paper-ui';
          const App = () => <PaperSurface texture={false}><PaperCard><PencilText animate={false}>Paper UI</PencilText><PaperButton>Ready</PaperButton></PaperCard></PaperSurface>;
          createRoot(document.getElementById('root')!).render(<App />);
          TSX
          cat > tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ESNext","lib":["DOM","ESNext"],"module":"ESNext","moduleResolution":"Bundler","jsx":"react-jsx","strict":true,"noEmit":true,"skipLibCheck":true},"include":["src"]}
          JSON
          npx tsc --noEmit
          npx vite build
          css_file="$(find dist/assets -name '*.css' -print -quit)"
          test -n "$css_file"
          grep -q 'pui-button' "$css_file"

  stage:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: npm-alpha-staging
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use a staging-capable npm CLI
        run: npm install --global 'npm@^11'
      - name: Build exact alpha package
        run: |
          bun install --frozen-lockfile
          bun --filter @in-c0/paper-ui build
      - name: Upload to npm staged publishing (not live yet)
        working-directory: packages/paper-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN || secrets.NPM }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::No stage token found. Configure NPM_STAGE_TOKEN (preferred) or NPM as a GitHub Actions secret.'
            exit 1
          fi
          # npm may return 404 for a missing or unauthorized *scope*, even when the
          # package, token, and staged-publish command are otherwise valid.
          # Capture the CLI's exit status without suppressing a genuine failure.
          log_file="$RUNNER_TEMP/npm-stage-output.log"
          set +e
          npm stage publish --access public --tag alpha > "$log_file" 2>&1
          stage_status=$?
          set -e
          cat "$log_file"
          if [ "$stage_status" -ne 0 ]; then
            if grep -qi 'Scope not found' "$log_file"; then
              echo '::error title=npm scope missing or unauthorized::The @in-c0 scope is not accessible to this npm identity. Verify npm USERNAME or create/own npm organization in-c0, then grant the GitHub NPM/NPM_STAGE_TOKEN granular token stage-only write permission for that scope. GitHub in-c0 ownership alone grants no npm scope access.'
            elif grep -Eqi '(E401|ENEEDAUTH|E403|Invalid authentication|unauthorized)' "$log_file"; then
              echo '::error title=npm token invalid or insufficient::Check the token expiry, npm account identity and scoped package publishing permissions; do not print the token.'
            fi
            exit "$stage_status"
          fi
      - name: Explain the required human approval
        run: |
          echo '## npm alpha staged' >> "$GITHUB_STEP_SUMMARY"
          echo 'The package is staged, not published. An npm maintainer must review and approve it with 2FA at npmjs.com under Staged Packages.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Package: @in-c0/paper-ui@0.1.0-alpha.1, dist-tag: alpha' >> "$GITHUB_STEP_SUMMARY"
