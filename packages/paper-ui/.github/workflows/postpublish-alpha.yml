name: Verify approved npm alpha and create GitHub prerelease

# One-time post-approval reconciliation. This workflow only runs when
# this file itself is first committed to main, not on ordinary product pushes.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/postpublish-alpha.yml

concurrency:
  group: paper-ui-alpha-first-release
  cancel-in-progress: false

jobs:
  public-registry:
    name: Confirm public npm alpha and test real registry install
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify the public alpha distribution tag and version metadata
        shell: bash
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          version="$(npm view '@in-c0/paper-ui@alpha' version --json | tr -d '"[:space:]')"
          if [ "$version" != '0.1.0-alpha.1' ]; then
            echo "::error::Expected alpha version 0.1.0-alpha.1, got '$version'. No GitHub release will be created."
            exit 1
          fi
          integrity="$(npm view '@in-c0/paper-ui@0.1.0-alpha.1' dist.integrity --json | tr -d '"[:space:]')"
          if [[ ! "$integrity" =~ ^sha512- ]]; then
            echo '::error::The public version lacks a valid integrity hash. No release will be created.'
            exit 1
          fi
          npm view '@in-c0/paper-ui' dist-tags --json
          echo 'Public npm alpha and integrity confirmed.'
      - name: Install from PUBLIC npm registry into a clean React application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-alpha-consumer/src"
          cd "$RUNNER_TEMP/npm-alpha-consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --registry=https://registry.npmjs.org/ \
            '@in-c0/paper-ui@0.1.0-alpha.1' react@19 react-dom@19 \
            vite@8 typescript@6 '@types/react@19' '@types/react-dom@19'
          node -e "const p=require('./node_modules/@in-c0/paper-ui/package.json'); if(p.version!=='0.1.0-alpha.1') process.exit(1); console.log('Installed public alpha:', p.name, p.version)"
          cat > index.html <<'HTML'
          <!doctype html><html><head><meta charset="UTF-8"/></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
          HTML
          cat > src/main.tsx <<'TSX'
          import React from 'react';
          import '@in-c0/paper-ui/styles.css';
          import { createRoot } from 'react-dom/client';
          import { PaperSurface, PaperCard, PaperButton, PencilText } from '@in-c0/paper-ui';
          const App = () => <PaperSurface texture={false}>
            <PaperCard><PencilText animate={false}>Paper UI alpha</PencilText><PaperButton>Save</PaperButton></PaperCard>
          </PaperSurface>;
          createRoot(document.getElementById('root')!).render(<App />);
          TSX
          cat > tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ESNext","lib":["DOM","ESNext"],"module":"ESNext","moduleResolution":"Bundler","jsx":"react-jsx","strict":true,"noEmit":true,"skipLibCheck":true},"include":["src"]}
          JSON
          npx tsc --noEmit
          npx vite build
          css_file="$(find dist/assets -name '*.css' -print -quit)"
          test -n "$css_file"
          grep -q 'pui-button' "$css_file"
          echo 'Real registry package typechecks, builds, and bundles styles.'

  github-prerelease:
    name: Tag validated source commit and publish GitHub prerelease
    needs: public-registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4d52d8aa083811dd320649d258e656985f48f63b
      - name: Create release only for the exact source commit that was staged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 4d52d8aa083811dd320649d258e656985f48f63b
          VERSION_TAG: v0.1.0-alpha.1
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::The GitHub release $VERSION_TAG already exists. No duplicate created."
            exit 0
          fi
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION_TAG" 2>/dev/null | jq -r '.object.sha // empty' || true)"
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$SOURCE_SHA" ]; then
            echo "::error::The existing tag references a different commit ($existing_sha). Refusing to overwrite."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          # Paper UI 0.1.0-alpha.1

          First experimental alpha of the independently maintained Paper UI React component library.

          - Materials: paper texture, three grain-gradient presets, dithering, and halftone.
          - Components: PaperSurface, MaterialEffect, PencilText, PaperCard, PaperButton.
          - Tegaki handwriting renderer and Paper Shaders remain external dependencies.
          - ESM package with TypeScript declaration files and an explicit CSS import.
          - Source manifest, packed-package consumer, browser QA and independently installed public npm package were verified.

          **Install (explicit alpha opt-in):**
          ```bash
          npm install @in-c0/paper-ui@alpha
          ```

          **Import styles once in your React app:**
          ```tsx
          import '@in-c0/paper-ui/styles.css';
          ```

          - [npm package](https://www.npmjs.com/package/@in-c0/paper-ui)
          - [Interactive Studio](https://paper-ui-react-lab.vercel.app/)
          - [Source repository](https://github.com/in-c0/paper-ui)

          **Alpha notice:** APIs may change. Hardware-specific GPU performance, iOS Safari and accessibility audits are still ongoing. This is not yet certified as production-ready.
          NOTES
          if [ -n "$existing_sha" ]; then
            gh release create "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Paper UI v0.1.0-alpha.1' --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          else
            gh release create "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'Paper UI v0.1.0-alpha.1' --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          fi
          echo "Published GitHub prerelease for $SOURCE_SHA"
